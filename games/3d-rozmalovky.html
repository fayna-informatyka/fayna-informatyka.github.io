<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="author" content="пан Віталій">

<title>3D-розмальовки</title>
<style>
:root{--ink:#2C3550;--mute:#5E6782;--bg:#EEF0EA;--ok:#5E9A7C;--sun:#E9C46A}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #7FA7C9;outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#E3E6DE;border-bottom:3px solid #CBD0C4;flex-wrap:wrap}
#ttl{font-weight:800;font-size:1.15rem}
#ttl small{display:block;font-weight:700;font-size:.85rem;color:var(--mute)}
.sp{flex:1}
#prog{display:flex;align-items:center;gap:8px;font-weight:800}
#bar{width:min(220px,30vw);height:16px;border-radius:999px;border:3px solid var(--line,#2C3550);background:#fff;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
#wrap{position:relative;flex:1;min-height:0;background:linear-gradient(#CFE3EC,#EEF0EA 75%)}
#cv{width:100%;height:100%;display:block;touch-action:none}
#camB{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
#camB button{width:48px;height:48px;border-radius:14px;border:3px solid var(--ink);background:rgba(255,253,248,.92);font-weight:900;font-size:1.25rem;display:grid;place-items:center;padding:0}
#tip{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 16px;font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 var(--ink);text-align:center;max-width:90%;pointer-events:none}
#tip[hidden]{display:none}
#pal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px 12px 14px;background:#F6F4EE;border-top:3px solid #CBD0C4}
.pc{position:relative;width:68px;height:68px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:1.5rem;padding:0;box-shadow:0 4px 0 var(--ink);transition:transform .1s}
.pc[aria-pressed=true]{transform:translateY(-6px) scale(1.08);box-shadow:0 0 0 5px var(--sun),0 8px 0 var(--ink)}
.pc .left{position:absolute;bottom:-10px;right:-8px;min-width:26px;height:26px;border-radius:999px;background:#fff;border:3px solid var(--ink);font-size:.75rem;display:grid;place-items:center;padding:0 4px;color:var(--ink)}
.pc.done{opacity:.55}
.pc.done .left{background:var(--ok);color:#fff}
.lbl{position:absolute;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-weight:900;font-size:1rem;white-space:nowrap;pointer-events:none;box-shadow:0 3px 0 var(--ink);opacity:0;transition:opacity .5s}
.lbl.on{opacity:1}
#win{position:absolute;left:12px;top:12px;z-index:3;background:#fff;border:4px solid var(--ink);border-radius:20px;padding:12px 18px;box-shadow:0 6px 0 var(--ink);text-align:center;max-width:min(340px,70%)}
#win[hidden]{display:none}
#win h2{margin:0 0 4px;font-size:1.4rem}
#win p{margin:0 0 10px;font-weight:700;line-height:1.35}
.big{min-height:48px;padding:8px 20px;border-radius:14px;border:3px solid var(--ink);background:var(--sun);font-weight:900;font-size:1.05rem;box-shadow:0 4px 0 var(--ink)}
.cf{position:absolute;width:10px;height:14px;pointer-events:none;border-radius:2px}
@media (max-width:600px){.pc{width:54px;height:54px;font-size:1.2rem}#ttl{font-size:1rem}}
#menuB{min-height:44px;padding:6px 14px;border-radius:14px;border:3px solid var(--ink);background:#fff;font-weight:900;font-size:1rem;box-shadow:0 3px 0 var(--ink)}
#menu{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding:18px 16px 40px}
#menu[hidden]{display:none}
#menu .in{max-width:980px;margin:0 auto}
#menu h1{margin:0 0 4px;font-size:1.8rem}
#menu .sub{margin:0 0 18px;font-weight:700;color:var(--mute)}
.sec{margin:0 0 20px}
.sec h2{margin:0 0 10px;font-size:1.25rem}
.sec h2 em{font-style:normal;font-size:.8rem;font-weight:800;background:#E3E6DE;border:2px solid #CBD0C4;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 10px 10px;text-align:center;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px}
.card .ic{font-size:2.6rem;line-height:1.1}
.card .ic svg{width:2.2em;height:1.15em;display:block;margin:0 auto}
.card .nm{font-size:1rem}
.card .pb{width:100%;height:10px;border-radius:999px;border:2px solid var(--ink);background:#F1F1EC;overflow:hidden;margin-top:auto}
.card .pb i{display:block;height:100%;background:var(--ok)}
.card .pt{font-size:.8rem;color:var(--mute)}
.card:hover{transform:translateY(-2px)}
.card.soon{opacity:.5;box-shadow:0 5px 0 #9aa0ad;border-color:#9aa0ad;cursor:default}
.card.soon:hover{transform:none}
#win .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#win .big.alt{background:#fff}
@media (max-width:600px){#tip{font-size:.85rem;padding:6px 10px;max-width:70%}#menu h1{font-size:1.4rem}.grid{grid-template-columns:repeat(2,1fr)}.card{min-height:130px}.card .ic{font-size:2.1rem}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button type="button" id="menuB" aria-label="Обрати модель">☰ Моделі</button>
    <div id="ttl">3D-розмальовки<small id="mName"></small></div>
    <span class="sp"></span>
    <div id="prog"><div id="bar"><i id="barI"></i></div><span id="pct">0%</span></div>
  </div>
  <div id="wrap">
    <canvas id="cv" aria-label="3D-модель із кубиків для розфарбовування"></canvas>
    <div id="camB">
      <button type="button" id="cL" aria-label="Повернути ліворуч">⟲</button>
      <button type="button" id="cR" aria-label="Повернути праворуч">⟳</button>
      <button type="button" id="cU" aria-label="Подивитися згори">⤒</button>
      <button type="button" id="cD" aria-label="Подивитися знизу">⤓</button>
      <button type="button" id="cZi" aria-label="Наблизити">＋</button>
      <button type="button" id="cZo" aria-label="Віддалити">－</button>
      <button type="button" id="cH" aria-label="Повернути модель на місце">⌂</button>
    </div>
    <div id="tip" hidden></div>
    <div id="win" hidden><h2 id="wT"></h2><p id="wF"></p><div class="row"><button class="big" id="next" type="button">☰ Інші моделі</button><button class="big alt" id="again" type="button">↺ Ще раз</button></div></div>
  </div>
  <div id="pal"></div>
</div>
<div id="menu">
  <div class="in">
    <h1>3D-розмальовки 🎨</h1>
    <p class="sub">Обери модель і розфарбуй кожен кубик за номером. Твій прогрес зберігається.</p>
    <div id="secs"></div>
  </div>
</div>
