<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Медова галявина</title>
<style>
:root{--ink:#1F2A5C;--sun:#FFC93C;--coral:#FF6B8B;--mint:#27C9A0;--sky:#4CB5F5;--lilac:#9C88FF;--orange:#FF9F43;--cream:#FFF4D6;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--cream);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:#B6E59A}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#1F5E3A;border-bottom:4px solid #154A2C;flex-wrap:wrap;z-index:5}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:1.05rem;min-height:44px}
.pill svg{width:22px;height:22px}
.lvname{font-weight:800;font-size:1.1rem;color:#FFF4D6}
.sp{flex:1}
button{font:inherit;cursor:pointer}
.btn{min-height:48px;padding:10px 22px;border-radius:16px;border:3px solid var(--ink);background:var(--sun);color:var(--ink);font-weight:800;font-size:1.1rem;box-shadow:0 5px 0 var(--ink);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.w{background:#fff}
.btn.sm{min-height:44px;padding:6px 14px;font-size:1rem;box-shadow:0 3px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
#field{position:relative;flex:1;overflow:hidden;cursor:crosshair;touch-action:none;background:linear-gradient(#CDEFFF 0,#E8F8D8 32%,#B6E59A 100%)}
.deco{position:absolute;pointer-events:none;opacity:.9}
.ent{position:absolute;left:0;top:0;will-change:transform}
.star svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(31,42,92,.25));animation:tw 1.6s ease-in-out infinite}
@keyframes tw{50%{transform:scale(1.12)}}
.star.hid svg{filter:none;opacity:.55;animation:none}
.ob{cursor:pointer;z-index:2}
.ob>svg.body{width:100%;height:100%;display:block;transition:transform .15s}
.crk{opacity:0;transition:opacity .1s}
.ov[hidden],#tip[hidden],#banner[hidden]{display:none}
.ob.cracked .crk{opacity:1}
.ob.cracked>svg.body{transform:scale(.86)}
.ob.wig>svg.body{animation:wig .35s}
@keyframes wig{20%{transform:rotate(-12deg)}50%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
.mi{position:absolute;right:-6px;bottom:-6px;width:30px;height:40px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4));pointer-events:none}
#rocket{z-index:3;pointer-events:none;width:64px;height:84px}
#rocket svg{width:100%;height:100%;overflow:visible}
#rocket.bump svg{animation:wig .3s}
.fl{animation:fl .09s ease-in-out infinite alternate;transform-origin:32px 38px}
@keyframes fl{to{transform:scaleX(.78)}}
.pt{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:4;transition:transform .6s ease-out,opacity .6s ease-out}
#tip{position:absolute;z-index:6;max-width:260px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-weight:800;font-size:1.02rem;line-height:1.3;pointer-events:none;box-shadow:0 4px 0 var(--ink)}
#banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(2rem,6vw,3.4rem);font-weight:900;color:var(--sun);text-shadow:0 4px 0 #1F2A5C;pointer-events:none;z-index:6;text-align:center}
.ov{position:absolute;inset:0;z-index:10;display:flex;padding:16px;background:rgba(31,42,92,.72);overflow:auto}
.panel{background:#FFFDF7;color:var(--ink);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:24px;max-width:760px;width:100%;text-align:center;margin:auto}
.panel h1{margin:0 0 6px;font-size:clamp(1.8rem,5vw,2.6rem);color:var(--ink)}
.panel p{margin:6px 0;font-size:1.12rem;font-weight:700;line-height:1.4}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0;text-align:left}
.lg{display:flex;align-items:center;gap:8px;background:#EAF8E0;border:3px solid var(--ink);border-radius:18px;padding:10px}
.lg svg{flex:none}
.lg b{display:block;font-size:1rem}.lg span{font-size:.92rem;font-weight:700;line-height:1.25}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin:14px 0}
.lvb{min-height:64px;border-radius:18px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-weight:800;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--ink)}
.lvb .no{font-size:1.4rem}.lvb .nm{font-size:.9rem}.lvb .st{font-size:.95rem;letter-spacing:2px;color:#C98A00}
.lvb:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.info{text-align:left;display:grid;gap:12px;margin:14px 0}
.ib{background:#EAF8E0;border:3px solid var(--ink);border-radius:18px;padding:12px 16px}
.ib h2{margin:0 0 6px;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.ib p{margin:0;font-size:1.05rem}
.ib ul{margin:0;padding-left:22px;font-size:1.05rem;font-weight:700;line-height:1.45}
.age{display:inline-block;background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:900;font-size:1.05rem;margin:2px 4px 2px 0}
.info-ic{width:30px;height:30px;flex:none}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.big3{display:flex;justify-content:center;gap:8px;margin:10px 0}
.big3 svg{width:64px;height:64px}
.note{font-size:.98rem!important;color:#4F5A8A}
@media (max-width:520px){.pill{padding:4px 10px;font-size:.95rem}.lvname{font-size:.95rem}.panel{padding:18px}}
@media (prefers-reduced-motion:reduce){.star svg,.fl{animation:none}}
</style>
</head>

 for(var i=0;i<10;i++){var p=document.createElement("div");p.className="pt";p.style.background=c;p.style.left=o.x-5+"px";p.style.top=o.y-5+"px";field.appendChild(p);

 o.el.remove();S.obs=S.obs.filter(function(x){return x!==o});

function hit(o,b){if(!o.alive||S.done)return;

 wrong(o)}

 target.x=S.rx;target.y=S.ry;$("lvN").textContent=(i+1)+". "+lv.n;

function loop(now){var dt=Math.min(.05,(now-S.last)/1000);S.last=now;if(S.done)return;
 if(!document.hidden)S.t+=dt;
 var k=1-Math.pow(.0009,dt),px=S.rx,py=S.ry;
 S.rx+=(target.x-S.rx)*k;S.ry+=(target.y-S.ry)*k;
 S.rx=Math.max(RR,Math.min(W-RR,S.rx));S.ry=Math.max(RR,Math.min(H-RR,S.ry));
 S.obs.forEach(function(o){if(o.vx||o.vy){o.x+=o.vx*dt;o.y+=o.vy*dt;var r=o.s/2;
   if(o.x<r||o.x>W-r)o.vx*=-1;if(o.y<r||o.y>H-r)o.vy*=-1;o.x=Math.max(r,Math.min(W-r,o.x));o.y=Math.max(r,Math.min(H-r,o.y));place(o.el,o.x,o.y,o.s)}
  var dx=S.rx-o.x,dy=S.ry-o.y,d=Math.hypot(dx,dy)||1,m=RR+o.s*.42;
  if(d<m){S.rx=o.x+dx/d*m;S.ry=o.y+dy/d*m;
   if(now-S.bumpT>900){S.bumpT=now;rocketEl.classList.remove("bump");void rocketEl.offsetWidth;rocketEl.classList.add("bump");
    if(o.guard||S.lv.hints)wrong(o,"Бджілка не пролетить! "+NAME[o.t]+": "+(touchMode&&o.t==="R"?"натисни й потримай пальцем":HOW[o.t]))}}});
 var vx=S.rx-px,vy=S.ry-py;if(Math.hypot(vx,vy)>.6){var a=Math.atan2(vy,vx)*180/Math.PI+90,da=((a-S.ang+540)%360)-180;S.ang+=da*Math.min(1,dt*10)}
 rocketEl.style.transform="translate("+(S.rx-32)+"px,"+(S.ry-42)+"px) rotate("+S.ang+"deg)";
 for(var i=S.stars.length-1;i>=0;i--){var s=S.stars[i];if(!s.cover&&Math.hypot(S.rx-s.x,S.ry-s.y)<RR+s.s/2-3){
   s.el.remove();S.stars.splice(i,1);S.got++;sfx("star");
   if(S.spawned<S.lv.stars)addStar()}}
 hud();
 if(S.got>=S.lv.stars){finish();return}
 raf=requestAnimationFrame(loop)}
function rate(lv,t){return t<=lv.par?3:t<=lv.par*1.6?2:1}

 if(!best[i+1]||best[i+1]<n){best[i+1]=n;try{localStorage.setItem("fi_mh",JSON.stringify(best))}catch(e){}}
 var st="";for(var k=0;k<3;k++)st+=k<n?STAR:STAR0;

  '<p>Рівень «'+S.lv.n+'» · час: '+S.t.toFixed(1).replace(".",",")+' с</p>'+(n<3?'<p class="note">Три зірки — якщо встигнеш за '+S.lv.par+' с.</p>':'')+
  '<div class="row">'+(!last?'<button class="btn" id="nx" type="button">Наступний рівень →</button>':'')+'<button class="btn w" id="rp" type="button">↻ Ще раз</button><button class="btn w" id="ml" type="button">☰ Усі рівні</button></div></div>';
 ov.hidden=false;
 if($("nx"))$("nx").onclick=function(){start(i+1)};$("rp").onclick=function(){start(i)};$("ml").onclick=menu;
 ($("nx")||$("rp")).focus()}

 var nxt=0;while(nxt<LV.length-1&&best[nxt+1])nxt++;
 var lv=LV.map(function(l,i){var b=best[i+1]||0,s="";for(var k=0;k<3;k++)s+=k<b?"★":"☆";
  return '<button class="lvb" type="button" data-l="'+i+'"><span class="no">'+(i+1)+'</span><span class="nm">'+l.n+'</span><span class="st" aria-label="'+b+' з 3 зірок">'+s+'</span></button>'}).join("");
 ov.innerHTML='<div class="panel" role="dialog" aria-labelledby="mh"><h1 id="mh">Медова галявина</h1>'+
  '<p>Веди бджілку <b>вказівником миші</b> і збирай квіти. Перешкоди на шляху прибирай потрібною кнопкою!</p>'+
  '<div class="leg">'+["L","R","D"].map(function(t){return '<div class="lg"><svg viewBox="0 0 100 100" width="52" height="52" aria-hidden="true">'+OBS[t].replace(/^<svg[^>]*>/,"").replace(/<\/svg>$/,"")+'</svg>'+mouseIco(t,26,36).replace('class="mi" ','')+'<div><b>'+NAME[t]+'</b><span>'+SHORT[t]+'</span></div></div>'}).join("")+'</div>'+
  '<div class="lvls">'+lv+'</div><div class="row"><button class="btn" id="go" type="button">▶ Почати рівень '+(nxt+1)+'</button><button class="btn w" id="ab" type="button">ℹ Про гру</button></div>'+
  '<p class="note" id="tn" hidden>Цей тренажер для комп’ютерної мишки. На планшеті: веди бджілку пальцем, «праве клацання» — натисни й потримай.</p></div>';
 ov.hidden=false;
 [].forEach.call(ov.querySelectorAll("[data-l]"),function(b){b.onclick=function(){start(+b.dataset.l)}});
 $("go").onclick=function(){start(nxt)};$("ab").onclick=intro;$("go").focus({preventScroll:true});
 if(window.matchMedia&&!matchMedia("(pointer:fine)").matches)$("tn").hidden=false}
function intro(){if(S){S.done=true;cancelAnimationFrame(raf)}clearField();$("lvN").textContent="";
 ov.innerHTML='<div class="panel" role="dialog" aria-labelledby="ih"><h1 id="ih">Медова галявина</h1><p>Тренажер для комп’ютерної мишки</p>'+
 '<div class="info">'+
 '<div class="ib"><h2><svg class="info-ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F2A5C" stroke-width="2.2"><circle cx="12" cy="12" r="9" fill="#FF6B8B"/><circle cx="12" cy="12" r="5" fill="#fff"/><circle cx="12" cy="12" r="1.8" fill="#1F2A5C"/></svg>Мета гри</h2>'+
 '<p>Допомогти бджілці зібрати всі квіти на галявині. Бджілка летить за вказівником миші, а колючі кущі, павутину й дощові хмарки треба прибирати правильною дією мишкою. Чим швидше — тим більше зірок!</p></div>'+
 '<div class="ib"><h2><svg class="info-ic" viewBox="0 0 28 38" aria-hidden="true"><rect x="2" y="2" width="24" height="34" rx="12" fill="#fff" stroke="#1F2A5C" stroke-width="2.5"/><path d="M14 3.4A10.6 10.6 0 0 0 3.4 14V16H14z" fill="#3FA34D"/><path d="M2.5 16h23M14 2v14" stroke="#1F2A5C" stroke-width="2.5"/></svg>Які навички тренуються</h2><ul>'+
 '<li>Плавне й точне переміщення вказівника миші</li>'+
 '<li>Клацання лівою кнопкою</li>'+
 '<li>Клацання правою кнопкою</li>'+
 '<li>Подвійне клацання</li>'+
 '<li>Увага, швидкість реакції та вміння розрізняти, яку дію виконати</li></ul></div>'+
 '<div class="ib"><h2><svg class="info-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6L2.5 9.3l6.6-.8z" fill="#FFC93C" stroke="#1F2A5C" stroke-width="1.8" stroke-linejoin="round"/></svg>Для кого</h2>'+

 '</div><div class="row"><button class="btn" id="toL" type="button">Далі — до рівнів →</button></div></div>';
