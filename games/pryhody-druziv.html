<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="author" content="пан Віталій">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; connect-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Пригоди друзів</title>
<style>
:root{--ink:#2C3550;--mute:#5E6782;--bg:#EEF0EA;--card:#FFFDF8;--line:#2C3550;--fw:#4F7FA8;--lt:#5E9A7C;--rt:#C98A4B;--rp:#8C78B8;--ok:#5E9A7C;--bad:#C2665A;--sun:#E9C46A}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #7FA7C9;outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#E3E6DE;border-bottom:3px solid #CBD0C4;flex-wrap:wrap}
#ttl{font-weight:800;font-size:1.15rem}
#ttl small{display:block;font-weight:700;font-size:.85rem;color:var(--mute)}
.sp{flex:1}
#bLang b{color:var(--ok)}
.tb{min-height:44px;padding:6px 14px;border-radius:14px;border:3px solid var(--line);background:#fff;font-weight:800;font-size:1rem}
#main{flex:1;display:flex;min-height:0}
#sceneWrap{position:relative;flex:1;min-width:0;background:linear-gradient(#D5E0E6 0%,#E4E9E3 60%,#E4E9E3 100%)}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#camB{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
#camB button{width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:rgba(255,253,248,.92);font-weight:900;font-size:1.3rem;display:grid;place-items:center;padding:0}
#bubble{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 18px;font-weight:800;font-size:1.15rem;max-width:min(520px,90%);text-align:center;box-shadow:0 4px 0 var(--line);pointer-events:none}
#bubble.bad{background:#F6E3DF}
#bubble.good{background:#E3F0E6}
#panel{width:380px;flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:#F6F4EE;border-left:3px solid #CBD0C4;overflow:hidden;min-height:0}
#goal{background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800;font-size:.98rem;line-height:1.3;flex:none}
.st{display:flex;flex:none;align-items:center;justify-content:space-between;font-weight:900;font-size:.9rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
#cnt{font-size:.95rem;text-transform:none;letter-spacing:0;background:#fff;border:2px solid #CBD0C4;border-radius:999px;padding:2px 10px;color:var(--ink)}
#cnt.full{border-color:var(--bad);color:var(--bad)}
#pal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:none}
.cmd{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:3px solid var(--line);border-radius:14px;background:#fff;padding:4px 2px 3px;min-height:64px;box-shadow:0 3px 0 var(--line);font-weight:800;font-size:.76rem;transition:transform .08s}
.cmd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.cmd svg{width:34px;height:34px}
.cmd[disabled]{opacity:.35;cursor:not-allowed}
.cmd.hid{display:none}
#prog{flex:1 1 auto;min-height:80px;overflow:auto;background:#fff;border:3px dashed #B9BFB2;border-radius:16px;padding:6px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
#prog .empty{color:var(--mute);font-weight:700;padding:8px;font-size:.95rem}
.pc{position:relative;width:46px;height:48px;border:3px solid var(--line);border-radius:10px;background:#fff;display:grid;place-items:center;padding:0;box-shadow:0 2px 0 var(--line)}
.pc svg{width:30px;height:30px}
.pc .no{position:absolute;left:2px;top:0;font-size:.6rem;font-weight:900;color:var(--mute)}
.pc.now{outline:5px solid var(--sun);outline-offset:1px}
.pc.err{background:#F6E3DF;outline:5px solid var(--bad);outline-offset:1px}
.rep{flex-basis:100%;border:3px solid var(--rp);border-radius:12px;background:#F2EFF8;padding:4px 6px}
.rep.act{box-shadow:0 0 0 4px #C9BEE3}
.rep.now{outline:5px solid var(--sun)}
.rh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rh .rl{display:flex;align-items:center;gap:5px;border:none;background:none;font-weight:900;font-size:.92rem;color:#5B4C86;padding:0 2px;min-height:34px}
.rh .rl svg{width:24px;height:24px}
.rn{display:flex;align-items:center;gap:4px;margin-left:auto}
.rn button{width:34px;height:34px;border-radius:10px;border:3px solid var(--line);background:#fff;font-weight:900;font-size:1.05rem;padding:0}
.rn b{min-width:34px;text-align:center;font-size:1.02rem}
.rb{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;min-height:54px;border:2px dashed #B7ABD6;border-radius:10px;padding:3px}
.rb .empty{font-size:.85rem;padding:6px}
.rdel{width:34px;height:34px;border-radius:10px;border:3px solid var(--line);background:#fff;padding:0;font-size:.95rem}
.iter{font-weight:900;color:#5B4C86;font-size:.95rem}
#ctrl{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;flex:none}
#ctrl button{min-height:52px;border-radius:16px;border:3px solid var(--line);background:#fff;font-weight:900;font-size:1rem;box-shadow:0 4px 0 var(--line)}
#ctrl #go{background:var(--ok);color:#fff;font-size:1.25rem}
#ctrl #go.stop{background:var(--bad)}
#ctrl2{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
#ctrl2 button{min-height:42px;border-radius:14px;border:3px solid var(--line);background:#fff;font-weight:800;font-size:.95rem}
button[disabled]{opacity:.45;cursor:not-allowed}
#pop{position:fixed;z-index:30;background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px;display:flex;gap:6px;box-shadow:0 6px 0 var(--line)}
#pop button{width:58px;height:58px;border-radius:12px;border:3px solid var(--line);background:#fff;display:grid;place-items:center;padding:0;font-size:1.4rem}
#pop button svg{width:38px;height:38px}
#pop[hidden],.ov[hidden],#bubble[hidden]{display:none}
.ov{position:fixed;inset:0;z-index:20;display:flex;padding:16px;background:rgba(44,53,80,.55);overflow:auto}
.lngB{position:absolute;right:14px;top:14px;min-height:40px;padding:4px 12px;font-size:.95rem}.lngB b{color:var(--ok)}
.panel{position:relative;margin:auto;background:var(--card);border:4px solid var(--line);border-radius:26px;box-shadow:0 8px 0 var(--line);padding:22px;max-width:860px;width:100%;text-align:center}
.panel h1{margin:0 0 6px;font-size:clamp(1.6rem,4vw,2.3rem)}
.panel p{margin:6px 0;font-size:1.08rem;font-weight:700;line-height:1.4}
.big{min-height:54px;padding:10px 24px;border-radius:16px;border:3px solid var(--line);background:var(--sun);font-weight:900;font-size:1.15rem;box-shadow:0 5px 0 var(--line)}
.big.w{background:#fff}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.info{text-align:left;display:grid;gap:10px;margin:12px 0}
.ib{background:#EEF2E8;border:3px solid var(--line);border-radius:16px;padding:10px 14px}
.ib h2{margin:0 0 4px;font-size:1.1rem}
.ib p{margin:0;font-size:1.02rem}
.ib ul{margin:0;padding-left:22px;font-weight:700;line-height:1.45}
.age{display:inline-block;background:var(--sun);border:3px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:900;margin:2px 4px 2px 0}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.chb{border:3px solid var(--line);border-radius:16px;background:#fff;padding:10px 6px;font-weight:900;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px}
.chb .em{font-size:2rem;line-height:1}
.chb[aria-pressed=true]{background:#E3F0E6;box-shadow:0 0 0 4px var(--ok)}
.chwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:center}
#pv{width:100%;aspect-ratio:1;border-radius:20px;border:3px solid var(--line);background:linear-gradient(#D5E0E6,#E7EBE3);display:block}
.chap{margin:14px 0 4px;text-align:left;font-weight:900;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.chap span{font-size:.9rem;color:var(--mute);font-weight:700}
.lvg{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.lv{aspect-ratio:1;min-height:44px;border-radius:12px;border:3px solid var(--line);background:#fff;font-weight:900;font-size:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.lv i{font-style:normal;font-size:.62rem;color:#B98A1E;letter-spacing:-1px;margin-top:2px}
.lv.done{background:#E3F0E6}
.lv.lock{background:#E4E4E0;color:#9A9C95;border-color:#9A9C95}
.lv.cur{box-shadow:0 0 0 4px var(--sun)}
.stars3{display:flex;justify-content:center;gap:8px;margin:8px 0}
.stars3 svg{width:60px;height:60px}
.note{font-size:.95rem!important;color:var(--mute)}
#hold{position:relative;overflow:hidden}
#hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:#E9C46A88}
@media (max-width:820px){#main{flex-direction:column}#sceneWrap{flex:none;height:42vh}#panel{width:auto;border-left:none;border-top:3px solid #CBD0C4;flex:1}#prog{min-height:60px}.lvg{grid-template-columns:repeat(5,1fr)}.chwrap{grid-template-columns:1fr}#pv{max-width:240px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="tb" id="bMap" type="button">☰ Рівні</button>
    <div id="ttl"><span id="ttlT">Пригоди друзів</span><small id="sub"></small></div>
    <span class="sp"></span>
    <button class="tb" id="bLang" type="button" aria-label="Мова / Language"><b>UA</b> | EN</button>
    <button class="tb" id="bChar" type="button">🙂 Друг</button>
    <button class="tb" id="bSnd" type="button" aria-pressed="false">🔇 Звук</button>
  </div>
  <div id="main">
    <div id="sceneWrap">
      <canvas id="cv" aria-label="3D-сцена: стежка, виконавець і скринька"></canvas>
      <div id="camB">
        <button type="button" id="cL" aria-label="Повернути камеру ліворуч">⟲</button>
        <button type="button" id="cR" aria-label="Повернути камеру праворуч">⟳</button>
        <button type="button" id="cT" aria-label="Подивитися згори">👁</button>
        <button type="button" id="cZi" aria-label="Наблизити">＋</button>
        <button type="button" id="cZo" aria-label="Віддалити">－</button>
      </div>
      <div id="bubble" hidden></div>
    </div>
    <aside id="panel">
      <div id="goal"></div>
      <div class="st" id="stC">Команди</div>
      <div id="pal"></div>
      <div class="st"><span id="stP">Програма</span> <span id="cnt"></span></div>
      <div id="prog"></div>
      <div id="ctrl">
        <button type="button" id="go">▶ Старт</button>
        <button type="button" id="stp" aria-label="Виконати один крок">👣 Крок</button>
        <button type="button" id="rst" aria-label="Повернути друга на початок">↺ Знову</button>
      </div>
      <div id="ctrl2">
        <button type="button" id="bk">⌫ Остання</button>
        <button type="button" id="clr">🗑 Очистити</button>
      </div>
    </aside>
  </div>
  <div id="pop" hidden></div>
  <div class="ov" id="ov" hidden></div>
</div>
<script>

 for(r=0;r<rg;r++)for(s=0;s<sg;s++){var a=r*(sg+1)+s,b=a+sg+1;I.push(a,a+1,b,b,a+1,b+1)}return{P:P,N:N,I:I}}

 for(var s=0;s<=sg;s++){var a=s/sg*Math.PI*2,c=Math.cos(a),si=Math.sin(a),l=Math.hypot(1,sl);P.push(c*rb,-.5,si*rb,c*rt,.5,si*rt);N.push(c/l,sl/l,si/l,c/l,sl/l,si/l)}

 snd("step");G.pos=[nx,nz];return animate(560*sp,function(k){var e=ease(k);G.walk=k;placeChar(x+DX[d]*e,z+DZ[d]*e,ang(d),Math.abs(Math.sin(k*Math.PI*2))*.06)}).then(function(){return{ok:true,goal:nx===G.lv.goal[0]&&nz===G.lv.goal[1]}})}
function runAll(){if(G.run==="auto"){stopRun();return}if(!G.prog.length){bubble(T("Спершу склади програму з карток 👇"),"bad");return}$("pop").hidden=true;
 if(G.run!=="step")resetChar(true);var S=steps();if(!S.length){bubble(T("Повтор порожній — додай у нього команди"),"bad");return}G.run="auto";G.stopReq=false;G.act=null;renderProg();$("go").textContent=T("■ Стоп");$("go").classList.add("stop");
 (function next(){if(G.stopReq){finishRun();return}if(G.si>=S.length){fail(S[S.length-1],"short");return}var s=S[G.si++];hl(s);doStep(s).then(function(r){if(!r.ok)return fail(s,"off");if(r.goal)return win();setTimeout(next,90)})})()}
function stepOne(){if(G.run==="auto")return;if(!G.prog.length){bubble(T("Спершу склади програму з карток 👇"),"bad");return}$("pop").hidden=true;var S=steps();if(!S.length)return;
 if(G.run!=="step"){resetChar(true);G.run="step";G.act=null;renderProg()}if(G.busy)return;if(G.si>=S.length){fail(S[S.length-1],"short");return}
 var s=S[G.si++];G.busy=true;hl(s);doStep(s).then(function(r){G.busy=false;if(!r.ok)return fail(s,"off");if(r.goal)return win();bubble(T("Крок {0} з {1} 👣",G.si,S.length),"")})}

 bubble(T(why==="off"?"Ой! Там немає стежки. Подивись на червону картку 🔍":"Команди закінчилися, а до скриньки ще не дійшли. Додай команди 🙂"),"bad",true);G.run=null}
function win(){finishRun();G.celebrate=1;snd("win");var L=G.lv,st;
 if(L.bug)st=G.edits<=1?3:G.edits<=3?2:1;else{var c=totalCards();st=c<=L.opt?3:c<=L.opt+2?2:1}
 if(!SAVE.stars[L.n]||SAVE.stars[L.n]<st)SAVE.stars[L.n]=st;save();
 setTimeout(function(){var s="";for(var i=0;i<3;i++)s+=i<st?STAR:STAR0;var last=L.n>=100;
  var tip=st<3?'<p class="note">'+(L.bug?T('Три зірки — якщо виправиш помилку однією зміною.'):T('Три зірки — якщо вистачить {0} карток.',L.opt))+'</p>':'';
  showOv('<div class="panel" role="dialog" aria-labelledby="wh"><h1 id="wh">'+T(last?"Ти справжній програміст! 🏆":pick(Math.random,["Чудово!","Молодець!","Супер!","Так тримати!"]))+'</h1><div class="stars3" aria-label="'+T('{0} з 3 зірок',st)+'">'+s+'</div><p>'+T('Рівень {0} пройдено!',L.n)+'</p>'+tip+
   '<div class="row">'+(last?"":'<button class="big" id="wn" type="button">'+T('Далі →')+'</button>')+'<button class="big w" id="wr" type="button">'+T('↺ Ще раз')+'</button><button class="big w" id="wm" type="button">'+T('☰ Рівні')+'</button></div></div>');
  if($("wn"))$("wn").onclick=function(){hideOv();loadLevel(L.n+1)};$("wr").onclick=function(){hideOv();loadLevel(L.n)};$("wm").onclick=showMap;($("wn")||$("wr")).focus()},1100)}

function showOv(h){var o=$("ov");o.innerHTML=h;o.hidden=false;G.ovk="other";var pn=o.querySelector(".panel");if(pn){var b=document.createElement("button");b.type="button";b.className="tb lngB";b.setAttribute("aria-label","Мова / Language");b.innerHTML=SAVE.lang==="en"?'UA | <b>EN</b>':'<b>UA</b> | EN';b.onclick=function(){$("bLang").click()};pn.insertBefore(b,pn.firstChild)}}
function hideOv(){$("ov").hidden=true;$("ov").innerHTML="";if(pv)pv.on=false}
function loadLevel(n){if(n>100)n=100;var L=level(n);G.lv=L;G.n=n;G.edits=0;G.act=null;G.run=null;G.prog=L.bug?clone(L.bug):[];buildWorld(L);resetChar(true);
 $("sub").textContent=T("Рівень {0} · {1}",n,chapName(n));setGoal();
 renderPal();renderProg();bubble(L.bug?T("Знайди помилку в програмі 🔍"):n===1?T("Натискай «Вперед», а потім «Старт» ▶"):n===6?T("Нова команда — поворот! Друг повертається на місці 🔄"):n===41?T("Нова команда «Повтори» 🔁 Вона повторює картки всередині кілька разів"):T("Рівень {0}",n),"");
 try{localStorage.setItem("fi_cs_last",String(n))}catch(e){}}
function setGoal(){var L=G.lv,nm=cacc(CHARS[SAVE.ch<0?0:SAVE.ch]);$("goal").innerHTML=L.bug?T("🔍 Ця програма має помилку! Знайди картку, яку треба змінити або прибрати, і виправ її."):(L.max?T("🔁 Доведи {0} до скриньки. Карток мало — використай «Повтори»!",nm):T("💎 Склади програму, щоб довести {0} до скриньки.",nm))}
function showMap(){var cur=G.n||1,h='<div class="panel" role="dialog" aria-labelledby="mh"><h1 id="mh">'+T('Обери рівень')+'</h1>';
 CHAP.forEach(function(c,ci){var end=ci<CHAP.length-1?CHAP[ci+1][0]-1:100;if(c[0]===6)return;var a=c[0],b=c[0]===1?20:end;
  h+='<div class="chap">'+T(c[1])+' <span>'+T('· рівні {0}–{1} · {2}',a,b,T(c[0]===1?"вперед і повороти":c[2]))+'</span></div><div class="lvg">';
  for(var i=a;i<=b;i++){var s=SAVE.stars[i]||0,lk=!unlocked(i);h+='<button type="button" class="lv'+(s?" done":"")+(lk?" lock":"")+(i===cur?" cur":"")+'" data-l="'+i+'" '+(lk?'aria-label="Рівень '+i+' закрито"':'aria-label="'+T('Рівень {0}',i)+'"')+'>'+(lk?"🔒":i)+(s?'<i>'+"★★★".slice(0,s)+'</i>':'')+'</button>'}h+='</div>'});
 h+='<div class="row"><button class="big w" id="mi" type="button">'+T('ℹ Про гру')+'</button><button class="big w" id="mc" type="button">'+T('🙂 Змінити друга')+'</button>'+'</div></div>';
 showOv(h);[].forEach.call($("ov").querySelectorAll("[data-l]"),function(b){b.onclick=function(){var n=+b.dataset.l;if(!unlocked(n)){bubble("Спершу пройди рівень "+(n-1)+" 🔒","bad");return}hideOv();loadLevel(n)}});
 G.ovk='map';$("mi").onclick=showIntro;$("mc").onclick=showChars;
}
function showIntro(){showOv('<div class="panel" role="dialog" aria-labelledby="ih"><h1 id="ih">'+T('Пригоди друзів')+'</h1><p>'+T('Гра-алгоритм у 3D-світі')+'</p><div class="info">'+
 '<div class="ib"><h2>'+T('🎯 Мета гри')+'</h2><p>'+T('Склади з карток-стрілочок програму, щоб твій друг дійшов стежкою до скриньки з кристалом. Друг виконує команди по черзі — так само, як комп’ютер виконує алгоритм.')+'</p></div>'+
 '<div class="ib"><h2>'+T('🧠 Які навички тренуються')+'</h2><ul>'+['Складати алгоритм із команд «Вперед», «Ліворуч», «Праворуч»','Розрізняти напрямки з погляду виконавця','Використовувати команду «Повтори»','Знаходити й виправляти помилки в алгоритмі','Увагу, планування й терпіння'].map(function(x){return'<li>'+T(x)+'</li>'}).join('')+'</ul></div>'+
 '<div class="ib"><h2>'+T('👧👦 Для кого')+'</h2><p><span class="age">'+T('6–7 років')+'</span><span class="age">'+T('1 клас')+'</span></p><p style="margin-top:6px">'+T('100 рівнів: 1–40 — перші кроки й довгі стежки, 41–80 — команда «Повтори», 81–100 — знайди помилку в програмі.')+'</p></div>'+
 '</div><div class="row"><button class="big" id="ig" type="button">'+T('Далі →')+'</button></div></div>');G.ovk="intro";$("ig").onclick=function(){SAVE.intro=true;save();if(SAVE.ch<0)showChars();else showMap()};$("ig").focus({preventScroll:true})}
var pv=null;
function showChars(){var sel=SAVE.ch<0?0:SAVE.ch,h='<div class="panel" role="dialog" aria-labelledby="ch"><h1 id="ch">'+T('Обери свого друга')+'</h1><p>'+T('Він виконуватиме твої команди')+'</p><div class="chwrap"><canvas id="pv" aria-hidden="true"></canvas><div class="chars">';
 CHARS.forEach(function(c,i){h+='<button type="button" class="chb" data-ch="'+i+'" aria-pressed="'+(i===sel)+'"><span class="em">'+c.em+'</span>'+cname(c)+'</button>'});
 h+='</div></div><div class="row"><button class="big" id="chok" type="button">'+T('Готово ✓')+'</button></div></div>';showOv(h);G.ovk='chars';
 try{var e2=new Engine($("pv"),{shadow:1024});pv={eng:e2,on:true,sel:sel,root:grp([N("rbox","#93A981",[0,-.1,0],[2.4,.2,2.4]),N("box","#8C7560",[0,-.35,0],[2.3,.3,2.3])])};pv.ch=makeChar(sel);pv.ch.dyn=true;pv.root.ch.push(pv.ch)}catch(e){pv=null;$("pv").style.display="none"}
 [].forEach.call($("ov").querySelectorAll("[data-ch]"),function(b){b.onclick=function(){sel=+b.dataset.ch;[].forEach.call($("ov").querySelectorAll("[data-ch]"),function(x){x.setAttribute("aria-pressed",String(x===b))});if(pv){pv.root.ch[2]=pv.ch=makeChar(sel);pv.ch.dyn=true}}});
 $("chok").onclick=function(){SAVE.ch=sel;save();if(pv)pv.on=false;if(G.lv){var keep=[G.pos.slice(),G.dir];world.ch.splice(world.ch.indexOf(charNode),1);charNode=makeChar(sel);charNode.dyn=true;world.ch.push(charNode);placeChar(keep[0][0],keep[0][1],ang(keep[1]));setGoal()}if(G.lv)hideOv();else{hideOv();loadLevel(+(lastLv()||1))}};
 (function spin(ts){if(!pv||!pv.on)return;pv.ch.r=[0,ts/1000*.9,0];animChar(pv.ch,ts/1000,(ts/1000%2)/2);pv.eng.render(pv.root,{eye:[0,1.25,2.3],t:[0,.45,0],fov:.7,fogN:20,fogF:40,sh:1.6});requestAnimationFrame(spin)})(0)}
function lastLv(){try{return localStorage.getItem("fi_cs_last")}catch(e){return null}}

function applyLang(){var en=SAVE.lang==="en";document.documentElement.lang=en?"en":"uk";document.title=T("Пригоди друзів");$("ttlT").textContent=T("Пригоди друзів");
 $("bMap").textContent=T("☰ Рівні");$("bChar").textContent=T("🙂 Друг");$("bLang").innerHTML=en?'UA | <b>EN</b>':'<b>UA</b> | EN';$("stC").textContent=T("Команди");$("stP").textContent=T("Програма");
 if(G.run!=="auto")$("go").textContent=T("▶ Старт");$("stp").textContent=T("👣 Крок");$("rst").textContent=T("↺ Знову");$("bk").textContent=T("⌫ Остання");$("clr").textContent=T("🗑 Очистити");
 $("stp").setAttribute("aria-label",T("Виконати один крок"));$("rst").setAttribute("aria-label",T("Повернути друга на початок"));
 [["cL","Повернути камеру ліворуч"],["cR","Повернути камеру праворуч"],["cT","Подивитися згори"],["cZi","Наблизити"],["cZo","Віддалити"]].forEach(function(q){$(q[0]).setAttribute("aria-label",T(q[1]))});
 var cv=$("cv");if(cv)cv.setAttribute("aria-label",T("3D-сцена: стежка, виконавець і скринька"));sndUI();
 if(G.lv){$("sub").textContent=T("Рівень {0} · {1}",G.n,chapName(G.n));setGoal();renderPal();renderProg()}
 if(!$("ov").hidden){if(G.ovk==="map")showMap();else if(G.ovk==="intro")showIntro();else if(G.ovk==="chars"){if(pv)pv.on=false;showChars()}}}

$("go").onclick=runAll;$("stp").onclick=stepOne;$("rst").onclick=function(){if(G.run==="auto"){stopRun();setTimeout(function(){resetChar()},60)}else resetChar()};
$("bk").onclick=function(){if(G.run)return;var a=G.act&&G.act.body.length?G.act.body:G.prog;var it=a.pop();if(it===G.act)G.act=null;G.edits++;resetChar(true);renderProg()};
$("clr").onclick=function(){if(G.run)return;if(G.lv.bug){G.prog=clone(G.lv.bug);G.edits=0;bubble(T("Програму повернуто до початкової 🔍"),"")}else G.prog=[];G.act=null;resetChar(true);renderProg()};
$("bMap").onclick=showMap;$("bChar").onclick=showChars;

$("cL").onclick=function(){cam.taz-=Math.PI/2};$("cR").onclick=function(){cam.taz+=Math.PI/2};$("cT").onclick=function(){cam.top=!cam.top};
$("cZi").onclick=function(){cam.tdist=Math.max(5,cam.tdist-1.5)};$("cZo").onclick=function(){cam.tdist=Math.min(30,cam.tdist+1.5)};
(function(){var cv=$("cv"),dn=null;cv.addEventListener("pointerdown",function(e){dn={x:e.clientX,az:cam.taz};try{cv.setPointerCapture(e.pointerId)}catch(_){}cv.style.cursor="grabbing"});
 cv.addEventListener("pointermove",function(e){if(dn){cam.taz=dn.az-(e.clientX-dn.x)*.008}});
 function up(){dn=null;cv.style.cursor="grab"}cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
 cv.addEventListener("wheel",function(e){e.preventDefault();cam.tdist=Math.max(5,Math.min(30,cam.tdist+(e.deltaY>0?1:-1)))},{passive:false})})();

 var m={ArrowUp:"F",ArrowLeft:"L",ArrowRight:"R"}[e.key];if(m){e.preventDefault();addCmd(m)}else if(e.key==="Enter"&&document.activeElement===document.body){runAll()}else if(e.key==="Backspace"){e.preventDefault();$("bk").click()}});

requestAnimationFrame(frame);
