<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="author" content="пан Віталій">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; connect-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<title>Нагодуй зайчиків</title>
<style>
:root{--ink:#1F2A5C;--sun:#FFC93C;--coral:#FF6B8B;--mint:#27C9A0;--sky:#4CB5F5;--orange:#FF9F43;--cream:#FFF4D6;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:#B6E59A}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#1F5E3A;border-bottom:4px solid #154A2C;flex-wrap:wrap;z-index:5}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:1.05rem;min-height:44px}
.lvname{font-weight:800;font-size:1.1rem;color:#FFF4D6}
.sp{flex:1}
button{font:inherit;cursor:pointer}
.btn{min-height:48px;padding:10px 22px;border-radius:16px;border:3px solid var(--ink);background:var(--sun);color:var(--ink);font-weight:800;font-size:1.1rem;box-shadow:0 5px 0 var(--ink);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.w{background:#fff}
.btn.sm{min-height:44px;padding:6px 14px;font-size:1rem;box-shadow:0 3px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
#field{position:relative;flex:1;overflow:hidden;cursor:default;touch-action:none;background:linear-gradient(#CDEFFF 0,#E8F8D8 22%,#A9DE8A 100%)}
.deco{position:absolute;pointer-events:none}
.hole{position:absolute;pointer-events:none}
.hole .pit{position:absolute;left:0;right:0;bottom:0;height:26%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#3B2614 0,#5A3A1E 60%,#7A5230 100%);box-shadow:0 4px 0 #8E6A3F}
.hole .win{position:absolute;left:-10%;right:-10%;top:-270%;bottom:13%;overflow:hidden}
.hole .rim{position:absolute;left:-4%;right:-4%;bottom:-4%;height:16%;border-radius:0 0 50% 50%/0 0 100% 100%;background:#8E6A3F;border-top:3px solid #A97E4C}
.cr{position:absolute;left:10%;width:80%;bottom:-100%;transition:bottom .22s ease-out;pointer-events:none}
.cr.up{bottom:0}
.cr svg{display:block;width:100%;height:auto;pointer-events:auto;cursor:pointer}
.cr.fed svg,.cr.gone svg{pointer-events:none}
.cr.hurry svg{animation:wig .4s infinite}
@keyframes wig{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.cr .happy{display:none}.cr.fed .happy{display:inline}.cr.fed .calm{display:none}
.cr.oops svg{animation:wig .3s 2}
.ft{position:absolute;pointer-events:none;font-weight:900;font-size:1.6rem;z-index:6;color:#fff;text-shadow:0 3px 0 var(--ink);transition:transform .8s ease-out,opacity .8s ease-out}
.miss{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:4px solid #fff;pointer-events:none;z-index:6;transition:transform .45s ease-out,opacity .45s ease-out}
#tip{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:6;max-width:min(92%,520px);background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:8px 14px;font-weight:800;font-size:1.05rem;text-align:center;box-shadow:0 4px 0 var(--ink);pointer-events:none}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(2rem,6vw,3.4rem);font-weight:900;color:var(--sun);text-shadow:0 4px 0 #1F2A5C;pointer-events:none;z-index:6;text-align:center}
.ov{position:absolute;inset:0;z-index:10;display:flex;padding:16px;background:rgba(31,42,92,.72);overflow:auto}
.ov[hidden],#tip[hidden],#banner[hidden]{display:none}
.panel{background:#FFFDF7;color:var(--ink);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:22px;max-width:820px;width:100%;text-align:center;margin:auto}
.panel h1{margin:0 0 6px;font-size:clamp(1.8rem,5vw,2.6rem)}
.panel p{margin:6px 0;font-size:1.1rem;font-weight:700;line-height:1.4}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
.tab{min-height:48px;padding:8px 16px;border-radius:16px;border:3px solid var(--ink);background:#fff;font-weight:900;font-size:1.05rem;box-shadow:0 4px 0 var(--ink)}
.tab[aria-selected="true"]{background:var(--sun)}
.tab small{display:block;font-size:.78rem;font-weight:800;opacity:.8}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.lvb{min-height:60px;border-radius:16px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-weight:800;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 var(--ink)}
.lvb .no{font-size:1.3rem}.lvb .st{font-size:.9rem;letter-spacing:1px;color:#C98A00}
.lvb.done{background:#EAF8E0}
.lvb:focus-visible,.tab:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.info{text-align:left;display:grid;gap:12px;margin:14px 0}
.ib{background:#EAF8E0;border:3px solid var(--ink);border-radius:18px;padding:12px 16px}
.ib h2{margin:0 0 6px;font-size:1.15rem}
.ib p{margin:0;font-size:1.05rem}
.ib ul{margin:0;padding-left:22px;font-size:1.05rem;font-weight:700;line-height:1.45}
.age{display:inline-block;background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:900;font-size:1.02rem;margin:2px 4px 2px 0}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.big3{font-size:3rem;letter-spacing:6px;color:#E0A100;margin:6px 0}
.res{font-size:1.25rem!important}
.note{font-size:.98rem!important;color:#4F5A8A}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.legend div{display:flex;align-items:center;gap:8px;background:#EAF8E0;border:3px solid var(--ink);border-radius:16px;padding:6px 12px;font-weight:800}
.legend svg{width:54px;height:auto}
@media (max-width:560px){.pill{padding:4px 10px;font-size:.95rem}.lvname{font-size:.95rem}.panel{padding:16px}.lvls{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){.cr{transition:none}.cr.hurry svg,.cr.oops svg{animation:none}}
</style>
</head>
<body>
<div id="app">
 <div id="hud">
  <button class="btn sm w" id="menuB" type="button">☰ Меню</button>
  <span class="lvname" id="lvN"></span>
  <span class="sp"></span>
  <span class="pill" aria-label="Нагодовано зайчиків">🥕 <b id="fedC">0</b>/<b id="totC">0</b></span>
  <span class="pill" aria-label="Клацання мимо">✖ <b id="missC">0</b></span>
  <button class="btn sm w" id="sndB" type="button" aria-label="Звук">🔊</button>
 </div>
 <div id="field" aria-label="Галявина з норками">
  <div id="tip" hidden></div><div id="banner" hidden></div>
  <div class="ov" id="ov"></div>
 </div>
</div>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)},field=$("field"),ov=$("ov");
var LV=[{n:"Легкий",a:"1 клас"},{n:"Середній",a:"2 клас"},{n:"Складний",a:"3–4 клас"}];
function P(L,s){if(L===0)return{N:5+Math.floor(s/3),stay:5-s*.07,sim:1,cols:3,rows:2,k:.8,gap:.7,hog:0};
 if(L===1)return{N:6+Math.floor(s/3),stay:3.2-s*.06,sim:s<5?1:2,cols:3,rows:3,k:.72,gap:.5,hog:s>=10?.12:0};
 return{N:8+Math.floor(s/3),stay:2.4-s*.05,sim:s<5?2:3,cols:4,rows:3,k:.64,gap:.35,hog:.18+s*.01}}
/* ---------- малюнки ---------- */
var BUN='<svg viewBox="0 0 120 150" aria-hidden="true"><ellipse cx="60" cy="100" rx="56" ry="52" fill="transparent"/><rect x="28" y="4" width="64" height="60" fill="transparent"/>'+
 '<path d="M38 70C30 40 30 8 42 6c12-2 14 34 10 62z" fill="#F4F1EC" stroke="#1F2A5C" stroke-width="4"/><path d="M40 62c-4-20-4-44 3-46 6-1 7 24 5 46z" fill="#FFB4CB"/>'+
 '<path d="M82 70c8-30 8-62-4-64-12-2-14 34-10 62z" fill="#F4F1EC" stroke="#1F2A5C" stroke-width="4"/><path d="M80 62c4-20 4-44-3-46-6-1-7 24-5 46z" fill="#FFB4CB"/>'+
 '<ellipse cx="60" cy="112" rx="46" ry="40" fill="#F4F1EC" stroke="#1F2A5C" stroke-width="4"/>'+
 '<ellipse cx="60" cy="96" rx="40" ry="34" fill="#FFFFFF" stroke="#1F2A5C" stroke-width="4"/>'+
 '<g class="calm"><ellipse cx="45" cy="90" rx="5.5" ry="7" fill="#1F2A5C"/><ellipse cx="75" cy="90" rx="5.5" ry="7" fill="#1F2A5C"/><circle cx="47" cy="87" r="2" fill="#fff"/><circle cx="77" cy="87" r="2" fill="#fff"/></g>'+
 '<g class="happy" fill="none" stroke="#1F2A5C" stroke-width="4" stroke-linecap="round"><path d="M39 92q6-8 12 0"/><path d="M69 92q6-8 12 0"/></g>'+
 '<ellipse cx="34" cy="104" rx="7" ry="4.5" fill="#FFB4CB"/><ellipse cx="86" cy="104" rx="7" ry="4.5" fill="#FFB4CB"/>'+
 '<path d="M55 102h10l-5 6z" fill="#FF6B8B"/><path d="M60 108v5m0 0q-5 5-9 1m9-1q5 5 9 1" fill="none" stroke="#1F2A5C" stroke-width="3" stroke-linecap="round"/>'+
 '<g class="happy"><path d="M58 116l26 10-4 6z" fill="#FF9F43" stroke="#1F2A5C" stroke-width="3" stroke-linejoin="round"/><path d="M84 126l8-8m-6 11l10-3" stroke="#27C9A0" stroke-width="4" stroke-linecap="round"/></g>'+
 '</svg>';
var HOG=(function(){var sp="";for(var i=0;i<15;i++){var an=Math.PI*(1.02+i*0.068),r1=40,r2=62,w=0.12,cx=60,cy=118;
 var x1=cx+Math.cos(an-w)*r1,y1=cy+Math.sin(an-w)*r1,x2=cx+Math.cos(an)*r2,y2=cy+Math.sin(an)*r2,x3=cx+Math.cos(an+w)*r1,y3=cy+Math.sin(an+w)*r1;
 sp+='<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+'L'+x2.toFixed(1)+' '+y2.toFixed(1)+'L'+x3.toFixed(1)+' '+y3.toFixed(1)+'z" fill="'+(i%2?"#5E3A1A":"#7A4B22")+'" stroke="#1F2A5C" stroke-width="2.5" stroke-linejoin="round"/>'}
 return '<svg viewBox="0 0 120 150" aria-hidden="true"><ellipse cx="60" cy="110" rx="58" ry="48" fill="transparent"/>'+sp+
 '<path d="M14 150C14 110 34 82 60 82s46 28 46 68z" fill="#8B5A2B" stroke="#1F2A5C" stroke-width="4"/>'+
 '<path d="M36 150c0-22 10-40 24-40s24 18 24 40z" fill="#F5D7A8" stroke="#1F2A5C" stroke-width="4"/>'+
 '<circle cx="51" cy="124" r="4.5" fill="#1F2A5C"/><circle cx="69" cy="124" r="4.5" fill="#1F2A5C"/>'+
 '<ellipse cx="60" cy="138" rx="7" ry="5.5" fill="#1F2A5C"/><circle cx="58" cy="136" r="1.8" fill="#fff"/>'+
 '<ellipse cx="44" cy="134" rx="5" ry="3" fill="#FFB4CB"/><ellipse cx="76" cy="134" rx="5" ry="3" fill="#FFB4CB"/></svg>'})();
/* ---------- звук ---------- */
var AC=null,snd=true;try{snd=localStorage.getItem("fi_bun_snd")!=="0"}catch(_){}
function beep(f,d,t){if(!snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(_){}}
function sndUI(){$("sndB").textContent=snd?"🔊":"🔇";$("sndB").setAttribute("aria-label",snd?"Вимкнути звук":"Увімкнути звук")}
$("sndB").onclick=function(){snd=!snd;try{localStorage.setItem("fi_bun_snd",snd?"1":"0")}catch(_){}sndUI()};sndUI();
/* ---------- збереження ---------- */
var best={};try{best=JSON.parse(localStorage.getItem("fi_bun")||"{}")||{}}catch(_){best={}}
function saveBest(){try{localStorage.setItem("fi_bun",JSON.stringify(best))}catch(_){}}
/* ---------- гра ---------- */
var S=null,raf=0,holes=[],curTab=0;
function tip(t,ms){var e=$("tip");e.textContent=t;e.hidden=false;clearTimeout(tip.t);tip.t=setTimeout(function(){e.hidden=true},ms||2200)}
function banner(t,ms){var e=$("banner");e.textContent=t;e.hidden=false;clearTimeout(banner.t);banner.t=setTimeout(function(){e.hidden=true},ms||1200)}
function clearField(){[].forEach.call(field.querySelectorAll(".hole,.deco,.ft,.miss"),function(n){n.remove()});holes=[]}
function deco(){var W=field.clientWidth,H=field.clientHeight,fl=["#FF6B8B","#FFC93C","#9C88FF","#fff"];
 for(var i=0;i<14;i++){var d=document.createElement("div");d.className="deco";var x=(i*137%100),y=30+(i*53%68);d.style.left=x+"%";d.style.top=y+"%";
  d.innerHTML=i%3?'<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 26V12M13 18l-6-6M13 16l6-7" stroke="#4E9A3A" stroke-width="3" fill="none" stroke-linecap="round"/></svg>':'<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="'+fl[i%4]+'"/><circle cx="11" cy="11" r="2.5" fill="#FFC93C"/></svg>';field.appendChild(d)}}
function layout(p){clearField();deco();var W=field.clientWidth,H=field.clientHeight,top=70,cw=W/p.cols,ch=(H-top-10)/p.rows,sz=Math.min(cw,ch*.95)*p.k;
 for(var r=0;r<p.rows;r++)for(var c=0;c<p.cols;c++){var h=document.createElement("div");h.className="hole";var x=cw*(c+.5)+((r%2)?cw*.12:-cw*.08),y=top+ch*(r+.5)+sz*.35;
  h.style.width=sz+"px";h.style.height=sz*.4+"px";h.style.left=(x-sz/2)+"px";h.style.top=(y-sz*.4)+"px";
  h.innerHTML='<div class="pit"></div><div class="win"></div><div class="rim"></div>';field.insertBefore(h,ov);holes.push({el:h,win:h.querySelector(".win"),busy:false,x:x,y:y,sz:sz})}}
function start(L,s){S={L:L,s:s,p:P(L,s),spawned:0,fed:0,miss:0,esc:0,hogs:0,live:[],t0:performance.now(),next:performance.now()+900,done:false};
 ov.hidden=true;layout(S.p);lastW=field.clientWidth;$("lvN").textContent=LV[L].n+" · завдання "+(s+1)+" з 15";$("fedC").textContent="0";$("totC").textContent=S.p.N;$("missC").textContent="0";
 banner("Готові? 🐰",900);cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function spawn(hog){var free=holes.filter(function(h){return!h.busy});if(!free.length)return false;var h=free[Math.floor(Math.random()*free.length)];h.busy=true;
 var c=document.createElement("div");c.className="cr";c.innerHTML=hog?HOG:BUN;h.win.appendChild(c);
 var o={h:h,el:c,hog:hog,t:performance.now(),state:"up"};S.live.push(o);
 requestAnimationFrame(function(){requestAnimationFrame(function(){c.classList.add("up")})});
 c.querySelector("svg").addEventListener("pointerdown",function(e){e.stopPropagation();hit(o,e)});return true}
function hide(o,cls){o.state="gone";o.el.classList.remove("hurry");if(cls)o.el.classList.add(cls);setTimeout(function(){o.el.classList.remove("up")},cls==="fed"?450:cls==="oops"?600:0);
 setTimeout(function(){o.el.remove();o.h.busy=false},cls?900:450);S.live=S.live.filter(function(x){return x!==o})}
function floatText(x,y,t){var f=document.createElement("div");f.className="ft";f.textContent=t;f.style.left=x+"px";f.style.top=y+"px";field.appendChild(f);
 requestAnimationFrame(function(){f.style.transform="translateY(-60px)";f.style.opacity="0"});setTimeout(function(){f.remove()},900)}
function hit(o,e){if(!S||S.done||o.state!=="up")return;
 if(e.pointerType==="mouse"&&e.button!==0){tip("Клацай лівою кнопкою мишки 🖱",1800);return}
 var r=field.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 if(o.hog){S.miss++;$("missC").textContent=S.miss;hide(o,"oops");beep(180,.25,"square");floatText(x-20,y-30,"Ой! Це їжачок 🦔");return}
 S.fed++;$("fedC").textContent=S.fed;hide(o,"fed");beep(660,.12);setTimeout(function(){beep(880,.14)},90);floatText(x-14,y-40,"🥕")}
field.addEventListener("pointerdown",function(e){if(!S||S.done||!ov.hidden)return;if(e.target.closest&&e.target.closest("#hud"))return;
 if(e.pointerType==="mouse"&&e.button!==0)return;
 S.miss++;$("missC").textContent=S.miss;beep(220,.08,"triangle");var r=field.getBoundingClientRect(),m=document.createElement("div");m.className="miss";m.style.left=(e.clientX-r.left)+"px";m.style.top=(e.clientY-r.top)+"px";field.appendChild(m);
 requestAnimationFrame(function(){m.style.transform="scale(1.8)";m.style.opacity="0"});setTimeout(function(){m.remove()},500)});
field.addEventListener("contextmenu",function(e){e.preventDefault()});
function loop(now){if(!S||S.done)return;raf=requestAnimationFrame(loop);var p=S.p;
 S.live.slice().forEach(function(o){var age=(now-o.t)/1000;if(o.state==="up"){if(age>p.stay-1)o.el.classList.add("hurry");if(age>p.stay){if(!o.hog){S.esc++}hide(o,null)}}});
 var bunLive=S.live.filter(function(o){return!o.hog}).length;
 if(S.spawned<p.N&&now>=S.next&&bunLive<p.sim){if(spawn(false)){S.spawned++;S.next=now+p.gap*1000+Math.random()*400;
  if(p.hog&&S.spawned>1&&!S.live.some(function(o){return o.hog})&&Math.random()<p.hog*1.4){if(spawn(true))S.hogs++}}}
 if(S.spawned>=p.N&&!S.live.some(function(o){return!o.hog})){S.live.forEach(function(o){hide(o,null)});finish()}}
function stars(){var N=S.p.N,f=S.fed,m=S.miss;if(f<Math.ceil(N*.6))return 0;if(f===N&&m<=1)return 3;if(f>=Math.ceil(N*.8)&&m<=3)return 2;return 1}
function finish(){S.done=true;cancelAnimationFrame(raf);var st=stars(),key=S.L+"-"+S.s;if(st>(best[key]||0)){best[key]=st;saveBest()}
 var s3="";for(var k=0;k<3;k++)s3+=k<st?"★":"☆";
 var msg=st===3?"Чудово! Усі зайчики ситі! 🎉":st===2?"Дуже добре! 👏":st===1?"Добре! Спробуй отримати більше зірок":"Зайчики ще голодні. Спробуй ще раз — у тебе вийде!";
 var nxt=S.s<14?'<button class="btn" id="nx" type="button">Далі → завдання '+(S.s+2)+'</button>':(S.L<2?'<button class="btn" id="nx" type="button">Далі → '+LV[S.L+1].n+' рівень</button>':'');
 ov.innerHTML='<div class="panel" role="dialog" aria-labelledby="rh"><h1 id="rh">'+msg+'</h1><div class="big3" aria-label="'+st+' з 3 зірок">'+s3+'</div>'+
  '<p class="res">Нагодовано: <b>'+S.fed+' з '+S.p.N+'</b> 🥕</p><p class="res">Клацань мимо: <b>'+S.miss+'</b></p>'+(S.hogs?'<p class="note">Їжачків клацати не треба — вони не їдять моркву 🦔</p>':'')+
  '<div class="row">'+(st?nxt:'')+'<button class="btn w" id="rp" type="button">↺ Ще раз</button><button class="btn w" id="mn" type="button">☰ Завдання</button></div></div>';
 ov.hidden=false;var L=S.L,s=S.s;
 if($("nx"))$("nx").onclick=function(){if(s<14)start(L,s+1);else start(L+1,0)};
 $("rp").onclick=function(){start(L,s)};$("mn").onclick=function(){menu(L)};(($("nx")&&st)?$("nx"):$("rp")).focus({preventScroll:true})}
function menu(tab){if(S){S.done=true;cancelAnimationFrame(raf)}clearField();deco();$("lvN").textContent="";if(tab!=null)curTab=tab;
 var tabs=LV.map(function(l,i){var n=0;for(var s=0;s<15;s++)n+=best[i+"-"+s]||0;return '<button class="tab" role="tab" type="button" data-t="'+i+'" aria-selected="'+(i===curTab)+'">'+l.n+'<small>'+l.a+' · ★ '+n+'/45</small></button>'}).join("");
