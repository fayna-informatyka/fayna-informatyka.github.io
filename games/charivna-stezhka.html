<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="author" content="пан Віталій">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; connect-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Чарівна стежка</title>
<style>
:root{--ink:#2C3550;--mute:#5E6782;--bg:#EEF0EA;--card:#FFFDF8;--line:#2C3550;--fw:#4F7FA8;--lt:#5E9A7C;--rt:#C98A4B;--rp:#8C78B8;--ok:#5E9A7C;--bad:#C2665A;--sun:#E9C46A}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #7FA7C9;outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#E3E6DE;border-bottom:3px solid #CBD0C4;flex-wrap:wrap}
#ttl{font-weight:800;font-size:1.15rem}
#ttl small{display:block;font-weight:700;font-size:.85rem;color:var(--mute)}
.sp{flex:1}
.tb{min-height:44px;padding:6px 14px;border-radius:14px;border:3px solid var(--line);background:#fff;font-weight:800;font-size:1rem}
#main{flex:1;display:flex;min-height:0}
#sceneWrap{position:relative;flex:1;min-width:0}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#camB{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
#camB button{width:48px;height:48px;border-radius:14px;border:3px solid var(--line);background:rgba(255,253,248,.92);font-weight:900;font-size:1.3rem;display:grid;place-items:center;padding:0}
#bubble{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 18px;font-weight:800;font-size:1.15rem;max-width:min(520px,90%);text-align:center;box-shadow:0 4px 0 var(--line);pointer-events:none}
#bubble.bad{background:#F6E3DF}
#bubble.good{background:#E3F0E6}
#panel{width:380px;flex:none;display:flex;flex-direction:column;gap:10px;padding:12px;background:#F6F4EE;border-left:3px solid #CBD0C4;overflow:auto}
#goal{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:800;font-size:1.05rem;line-height:1.3}
.st{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:1rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
#cnt{font-size:.95rem;text-transform:none;letter-spacing:0;background:#fff;border:2px solid #CBD0C4;border-radius:999px;padding:2px 10px;color:var(--ink)}
#cnt.full{border-color:var(--bad);color:var(--bad)}
#pal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cmd{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:3px solid var(--line);border-radius:16px;background:#fff;padding:6px 2px 4px;min-height:84px;box-shadow:0 4px 0 var(--line);font-weight:800;font-size:.82rem;transition:transform .08s}
.cmd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.cmd svg{width:46px;height:46px}
.cmd[disabled]{opacity:.35;cursor:not-allowed}
.cmd.hid{display:none}
#prog{min-height:120px;background:#fff;border:3px dashed #B9BFB2;border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
#prog .empty{color:var(--mute);font-weight:700;padding:8px;font-size:.95rem}
.pc{position:relative;width:58px;height:62px;border:3px solid var(--line);border-radius:12px;background:#fff;display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--line)}
.pc svg{width:38px;height:38px}
.pc .no{position:absolute;left:3px;top:1px;font-size:.7rem;font-weight:900;color:var(--mute)}
.pc.now{outline:5px solid var(--sun);outline-offset:1px}
.pc.err{background:#F6E3DF;outline:5px solid var(--bad);outline-offset:1px}
.rep{flex-basis:100%;border:3px solid var(--rp);border-radius:14px;background:#F2EFF8;padding:6px}
.rep.act{box-shadow:0 0 0 4px #C9BEE3}
.rep.now{outline:5px solid var(--sun)}
.rh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rh .rl{display:flex;align-items:center;gap:6px;border:none;background:none;font-weight:900;font-size:1rem;color:#5B4C86;padding:2px 4px;min-height:40px}
.rh .rl svg{width:30px;height:30px}
.rn{display:flex;align-items:center;gap:4px;margin-left:auto}
.rn button{width:40px;height:40px;border-radius:12px;border:3px solid var(--line);background:#fff;font-weight:900;font-size:1.2rem;padding:0}
.rn b{min-width:42px;text-align:center;font-size:1.15rem}
.rb{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:66px;border:2px dashed #B7ABD6;border-radius:10px;padding:4px}
.rb .empty{font-size:.85rem;padding:6px}
.rdel{width:40px;height:40px;border-radius:12px;border:3px solid var(--line);background:#fff;padding:0;font-size:1.05rem}
.iter{font-weight:900;color:#5B4C86;font-size:.95rem}
#ctrl{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
#ctrl button{min-height:56px;border-radius:16px;border:3px solid var(--line);background:#fff;font-weight:900;font-size:1rem;box-shadow:0 4px 0 var(--line)}
#ctrl #go{background:var(--ok);color:#fff;font-size:1.25rem}
#ctrl #go.stop{background:var(--bad)}
#ctrl2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ctrl2 button{min-height:46px;border-radius:14px;border:3px solid var(--line);background:#fff;font-weight:800;font-size:.95rem}
button[disabled]{opacity:.45;cursor:not-allowed}
#pop{position:fixed;z-index:30;background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px;display:flex;gap:6px;box-shadow:0 6px 0 var(--line)}
#pop button{width:58px;height:58px;border-radius:12px;border:3px solid var(--line);background:#fff;display:grid;place-items:center;padding:0;font-size:1.4rem}
#pop button svg{width:38px;height:38px}
#pop[hidden],.ov[hidden],#bubble[hidden]{display:none}
.ov{position:fixed;inset:0;z-index:20;display:flex;padding:16px;background:rgba(44,53,80,.55);overflow:auto}
.panel{margin:auto;background:var(--card);border:4px solid var(--line);border-radius:26px;box-shadow:0 8px 0 var(--line);padding:22px;max-width:860px;width:100%;text-align:center}
.panel h1{margin:0 0 6px;font-size:clamp(1.6rem,4vw,2.3rem)}
.panel p{margin:6px 0;font-size:1.08rem;font-weight:700;line-height:1.4}
.big{min-height:54px;padding:10px 24px;border-radius:16px;border:3px solid var(--line);background:var(--sun);font-weight:900;font-size:1.15rem;box-shadow:0 5px 0 var(--line)}
.big.w{background:#fff}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.info{text-align:left;display:grid;gap:10px;margin:12px 0}
.ib{background:#EEF2E8;border:3px solid var(--line);border-radius:16px;padding:10px 14px}
.ib h2{margin:0 0 4px;font-size:1.1rem}
.ib p{margin:0;font-size:1.02rem}
.ib ul{margin:0;padding-left:22px;font-weight:700;line-height:1.45}
.age{display:inline-block;background:var(--sun);border:3px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:900;margin:2px 4px 2px 0}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.chb{border:3px solid var(--line);border-radius:16px;background:#fff;padding:10px 6px;font-weight:900;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px}
.chb .em{font-size:2rem;line-height:1}
.chb[aria-pressed=true]{background:#E3F0E6;box-shadow:0 0 0 4px var(--ok)}
.chwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:center}
#pv{width:100%;aspect-ratio:1;border-radius:20px;border:3px solid var(--line);background:#E7EBE3;display:block}
.chap{margin:14px 0 4px;text-align:left;font-weight:900;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.chap span{font-size:.9rem;color:var(--mute);font-weight:700}
.lvg{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.lv{aspect-ratio:1;min-height:44px;border-radius:12px;border:3px solid var(--line);background:#fff;font-weight:900;font-size:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.lv i{font-style:normal;font-size:.62rem;color:#B98A1E;letter-spacing:-1px;margin-top:2px}
.lv.done{background:#E3F0E6}
.lv.lock{background:#E4E4E0;color:#9A9C95;border-color:#9A9C95}
.lv.cur{box-shadow:0 0 0 4px var(--sun)}
.stars3{display:flex;justify-content:center;gap:8px;margin:8px 0}
.stars3 svg{width:60px;height:60px}
.note{font-size:.95rem!important;color:var(--mute)}
#hold{position:relative;overflow:hidden}
#hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:#E9C46A88}
@media (max-width:820px){#main{flex-direction:column}#sceneWrap{flex:none;height:46vh}#panel{width:auto;border-left:none;border-top:3px solid #CBD0C4;flex:1}.lvg{grid-template-columns:repeat(5,1fr)}.chwrap{grid-template-columns:1fr}#pv{max-width:240px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="tb" id="bMap" type="button">☰ Рівні</button>
    <div id="ttl">Чарівна стежка<small id="sub"></small></div>
    <span class="sp"></span>
    <button class="tb" id="bChar" type="button">🙂 Друг</button>
    <button class="tb" id="bSnd" type="button" aria-pressed="false">🔇 Звук</button>
  </div>
  <div id="main">
    <div id="sceneWrap">
      <canvas id="cv" aria-label="3D-сцена: стежка, виконавець і скринька"></canvas>
      <div id="camB">
        <button type="button" id="cL" aria-label="Повернути камеру ліворуч">⟲</button>
        <button type="button" id="cR" aria-label="Повернути камеру праворуч">⟳</button>
        <button type="button" id="cT" aria-label="Подивитися згори">👁</button>
        <button type="button" id="cZi" aria-label="Наблизити">＋</button>
        <button type="button" id="cZo" aria-label="Віддалити">－</button>
      </div>
      <div id="bubble" hidden></div>
    </div>
    <aside id="panel">
      <div id="goal"></div>
      <div class="st">Команди</div>
      <div id="pal"></div>
      <div class="st">Програма <span id="cnt"></span></div>
      <div id="prog"></div>
      <div id="ctrl">
        <button type="button" id="go">▶ Старт</button>
        <button type="button" id="stp" aria-label="Виконати один крок">👣 Крок</button>
        <button type="button" id="rst" aria-label="Повернути друга на початок">↺ Знову</button>
      </div>
      <div id="ctrl2">
        <button type="button" id="bk">⌫ Остання</button>
        <button type="button" id="clr">🗑 Очистити</button>
      </div>
    </aside>
  </div>
  <div id="pop" hidden></div>
  <div class="ov" id="ov" hidden></div>
</div>

 (function spin(ts){if(!pv||!pv.on)return;pv.ch.r=[0,ts/1000*.9,0];pv.eng.render(pv.root,{eye:[0,1.4,2.6],t:[0,.45,0],fov:.7,fogN:20,fogF:40});requestAnimationFrame(spin)})(0)}
function lastLv(){try{return localStorage.getItem("fi_cs_last")}catch(e){return null}}

$("clr").onclick=function(){if(G.run)return;if(G.lv.bug){G.prog=clone(G.lv.bug);G.edits=0;bubble("Програму повернуто до початкової 🔍","")}else G.prog=[];G.act=null;resetChar(true);renderProg()};

function sndUI(){$("bSnd").textContent=SAVE.snd?"🔊 Звук":"🔇 Звук";$("bSnd").setAttribute("aria-pressed",String(SAVE.snd))}$("bSnd").onclick=function(){SAVE.snd=!SAVE.snd;save();sndUI();snd("step")};sndUI();

$("cZi").onclick=function(){cam.tdist=Math.max(5,cam.tdist-1.5)};$("cZo").onclick=function(){cam.tdist=Math.min(30,cam.tdist+1.5)};

 var m={ArrowUp:"F",ArrowLeft:"L",ArrowRight:"R"}[e.key];if(m){e.preventDefault();addCmd(m)}else if(e.key==="Enter"&&document.activeElement===document.body){runAll()}else if(e.key==="Backspace"){e.preventDefault();$("bk").click()}});
